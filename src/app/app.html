        <!-- WAVE GRADIENT -->
        <!-- =================================================== -->

          <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.055" />

          <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.10" />
        </linearGradient>

        <!-- =================================================== -->
        <!-- SOFT GLOW -->
        <!-- =================================================== -->

        <filter id="sectionWaveGlow" x="-20%" y="-50%" width="140%" height="200%">
          <feGaussianBlur stdDeviation="10" />
        </filter>
      </defs>

      <!-- ===================================================== -->
      <!-- BACK WAVE / GLOW -->
      <!-- ===================================================== -->

      <path
        class="section-wave__back"
        fill="url(#sectionWaveGradient)"
        filter="url(#sectionWaveGlow)"

          M 0 105
          C 170 55, 320 55, 500 105

          S 1270 55, 1440 105
          L 1440 180
          L 0 180
          Z

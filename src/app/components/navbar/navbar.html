    <!-- ========================================================= -->

        ></span>
      </a>

      <!-- WORK -->

      <a
        href="#work"
        class="nav-link group relative px-3 py-2 text-[13px] font-medium uppercase tracking-[0.12em] text-[#17131C]"
      >
        <span>Work</span>

        <span
          class="nav-particle pointer-events-none absolute right-0.5 top-1/2 h-[4px] w-[4px] mt-0.5 -translate-y-1/2 rounded-full"
          aria-hidden="true"
        ></span>
      </a>

      <!-- SKILLS -->

      <a
        href="#skills"
        class="nav-link group relative px-3 py-2 text-[13px] font-medium uppercase tracking-[0.12em] text-[#17131C]"
      >
        <span>Skills</span>

        <span
          class="nav-particle pointer-events-none absolute right-0.5 top-1/2 h-[4px] w-[4px] mt-0.5 -translate-y-1/2 rounded-full"
          aria-hidden="true"
        ></span>
      </a>

      <!-- EXPERIENCE -->

      <a
        href="#experience"
        class="nav-link group relative px-3 py-2 text-[13px] font-medium uppercase tracking-[0.12em] text-[#17131C]"
      >
        <span>Experience</span>

        ></span>
      </a>

      <!-- CONTACT -->

      <a
        href="#contact"
        class="nav-link group relative px-3 py-2 text-[13px] font-medium uppercase tracking-[0.12em] text-[#17131C]"
      >
        <span>Contact</span>

        <span

    <!-- ========================================================= -->
    <!-- PREFERENCES -->
    <!-- ========================================================= -->

    <div class="hidden items-center gap-2 md:flex">
      <!-- LANGUAGE -->

      <button
        type="button"
        aria-label="Change language"
        class="group flex h-9 items-center gap-2 rounded-full px-3 text-[#706A78] transition-all duration-300 hover:bg-[#F5F3F7] hover:text-[#7C3AED]"
      >
        <i
          class="pi pi-globe text-[15px] transition-transform duration-300 group-hover:rotate-12"
          aria-hidden="true"
        ></i>

        <span class="font-mono text-[10px] font-medium uppercase tracking-[0.12em]"> EN </span>
      </button>

      <!-- DIVIDER -->

      <span class="h-4 w-px bg-[#E7E2EC]" aria-hidden="true"></span>

      <!-- THEME -->

      <!-- THEME SWITCH -->

      <button
        type="button"
        class="theme-switch"
        [class.is-dark]="isDarkMode"
        [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.aria-pressed]="isDarkMode"
        (click)="toggleTheme()"
      >
        <span class="theme-switch-track">
          <!-- LIGHT ICON -->

          <span class="theme-switch-icon theme-switch-sun">
            <i class="pi pi-sun" aria-hidden="true"></i>
          </span>

          <!-- DARK ICON -->

          <span class="theme-switch-icon theme-switch-moon">
            <i class="pi pi-moon" aria-hidden="true"></i>
          </span>

          <!-- SLIDING KNOB -->

          <span class="theme-switch-knob">
            <i
              class="pi"
              [class.pi-sun]="!isDarkMode"
              [class.pi-moon]="isDarkMode"
              aria-hidden="true"
            ></i>
          </span>
        </span>
      </button>
    </div>

    <!-- ========================================================= -->
    <!-- MOBILE -->
    <!-- ========================================================= -->

    <button
      type="button"
      aria-label="Open navigation menu"
      class="group flex flex-col gap-1.5 md:hidden"

      <span
        class="h-px w-4 self-end bg-[#17131C] transition-all duration-300 group-hover:w-6"
      ></span>
    </button>

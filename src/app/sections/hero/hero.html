<section
  id="home"
  class="relative flex min-h-[calc(100vh-4rem)] items-center overflow-hidden bg-white"
>
  <div
    class="mx-auto grid w-full max-w-7xl grid-cols-1 items-center gap-12 px-6 py-20 lg:grid-cols-2 lg:px-8"
  >
    <!-- ========================================================= -->
    <!-- CONTENT -->
    <!-- ========================================================= -->

    <div class="relative z-30 max-w-2xl">
      <p class="mb-5 font-mono text-sm font-medium uppercase tracking-[0.18em] text-[#7C3AED]">
        Full Stack Developer
      </p>

      <h1
        class="text-5xl font-semibold leading-[1.05] tracking-[-0.045em] text-[#17131C] sm:text-6xl lg:text-7xl"
      >
        I build digital
        <span class="text-[#7C3AED]"> experiences</span>
        <br />
        with code & design.
      </h1>

      <p class="mt-7 max-w-xl text-base leading-7 text-[#706A78] sm:text-lg">
        I'm Giovanna, a Full Stack Developer focused on<br />
        front-end development, UI/UX and creating thoughtful<br />
        digital experiences.
      </p>
      <!-- ========================================================= -->
      <!-- ACTIONS -->
      <!-- ========================================================= -->

      <div class="mt-9 flex flex-wrap items-center gap-5">
        <!-- VIEW MY WORK -->

        <div class="group relative w-fit">
          <!-- TOP LEFT CORNER -->
          <div
            class="pointer-events-none absolute -left-1.5 -top-1.5 h-3 w-3 border-l border-t border-[#17131C]/30 transition-transform duration-500 ease-out group-hover:-translate-x-0.5 group-hover:-translate-y-0.5"
          ></div>

          <!-- BOTTOM RIGHT CORNER -->
          <div
            class="pointer-events-none absolute -bottom-1.5 -right-1.5 h-3 w-3 border-b border-r border-[#17131C]/30 transition-transform duration-500 ease-out group-hover:translate-x-0.5 group-hover:translate-y-0.5"
          ></div>

          <a
            href="#work"
            class="group relative z-10 flex items-center gap-4 border border-[#17131C] bg-[#17131C] px-7 py-3.5 text-sm font-medium tracking-wide text-white transition-all duration-300 hover:border-[#7C3AED] hover:bg-[#7C3AED]"
          >
            <span>View my work</span>

            <i
              class="pi pi-arrow-up-right text-base transition-transform duration-300 group-hover:translate-x-1"
              aria-hidden="true"
            ></i>
          </a>
        </div>

        <!-- CONTACT -->

        <a
          href="#contact"
          class="flex items-center gap-3 border border-[#E7E2EC] bg-white px-7 py-3.5 text-sm font-medium tracking-wide text-[#17131C] transition-all duration-300 hover:-translate-y-0.5 hover:border-[#7C3AED] hover:text-[#7C3AED]"
        >
          Contact me
        </a>
      </div>
    </div>

    <!-- ========================================================= -->
    <!-- VISUAL -->
    <!-- ========================================================= -->

    <div class="relative flex h-[560px] w-full items-center justify-center">
      <!-- ========================================================= -->
      <!-- THREADS — SUBTLE DEPTH LAYER -->
      <!-- ========================================================= -->

      <div class="hero-threads pointer-events-none absolute inset-0 z-[2]" aria-hidden="true">
        <div #threadsCanvas class="hero-threads-canvas"></div>
      </div>

      <!-- ========================================================= -->
      <!-- MAIN ATMOSPHERE -->
      <!-- ========================================================= -->

      <div
        class="hero-main-glow pointer-events-none absolute left-1/2 top-1/2 z-0 h-[520px] w-[520px]"
        aria-hidden="true"
      ></div>

      <!-- ========================================================= -->
      <!-- LARGE CENTRAL SPHERE -->
      <!-- ========================================================= -->

      <div
        class="hero-sphere pointer-events-none absolute left-1/2 top-1/2 z-[5] h-[430px] w-[430px]"
        aria-hidden="true"
      >
        <!-- MAIN ORB -->

        <div class="hero-sphere-core absolute inset-0"></div>

        <!-- PURPLE ATMOSPHERE -->

        <div class="hero-purple-glow absolute -inset-24"></div>

        <!-- BLUE ATMOSPHERE -->

        <div class="hero-blue-glow absolute -inset-28"></div>

        <!-- INNER LIGHT -->

        <div class="hero-inner-glow absolute inset-[45px]"></div>

        <!-- ======================================================= -->
        <!-- SUBTLE ORB PARTICLES -->
        <!-- ======================================================= -->

        <span class="hero-orbit-dot hero-orbit-dot-1 absolute left-[8%] top-[25%]"></span>

        <span class="hero-orbit-dot hero-orbit-dot-2 absolute right-[8%] top-[31%]"></span>

        <span class="hero-orbit-dot hero-orbit-dot-3 absolute bottom-[17%] left-[16%]"></span>

        <span class="hero-orbit-dot hero-orbit-dot-4 absolute bottom-[21%] right-[15%]"></span>
      </div>

      <!-- ========================================================= -->
      <!-- HAND DRAWN ORBIT RINGS -->
      <!-- ========================================================= -->

      <div
        class="hero-sketch-orbit hero-sketch-orbit-1 pointer-events-none absolute left-1/2 top-1/2 z-[8] h-[465px] w-[465px]"
        aria-hidden="true"
      ></div>

      <div
        class="hero-sketch-orbit hero-sketch-orbit-2 pointer-events-none absolute left-1/2 top-1/2 z-[8] h-[535px] w-[535px]"
        aria-hidden="true"
      ></div>

      <div
        class="hero-sketch-orbit hero-sketch-orbit-3 pointer-events-none absolute left-1/2 top-1/2 z-[8] h-[500px] w-[500px]"
        aria-hidden="true"
      ></div>

      <!-- ========================================================= -->
      <!-- WHITE LIGHT ORBS -->
      <!-- ========================================================= -->

      <span
        class="hero-light-orb hero-light-orb-1 pointer-events-none absolute left-[20%] top-[48%] z-[12]"
        aria-hidden="true"
      ></span>

      <span
        class="hero-light-orb hero-light-orb-2 pointer-events-none absolute right-[15%] top-[52%] z-[12]"
        aria-hidden="true"
      ></span>

      <span
        class="hero-light-orb hero-light-orb-3 pointer-events-none absolute bottom-[58%] left-[11%] z-[12]"
        aria-hidden="true"
      ></span>

      <!-- ========================================================= -->
      <!-- PURPLE PARTICLES -->
      <!-- ========================================================= -->

      <span
        class="hero-particle hero-particle-purple hero-particle-1 pointer-events-none absolute left-[15%] top-[9%] z-[15]"
        aria-hidden="true"
      ></span>

      <span
        class="hero-particle hero-particle-purple hero-particle-3 pointer-events-none absolute bottom-[15%] left-[5%] z-[15]"
        aria-hidden="true"
      ></span>

      <!-- ========================================================= -->
      <!-- BLUE PARTICLES -->
      <!-- ========================================================= -->

      <span
        class="hero-particle hero-particle-blue hero-particle-2 pointer-events-none absolute right-[15%] top-[20%] z-[15]"
        aria-hidden="true"
      ></span>

      <span
        class="hero-particle hero-particle-blue hero-particle-4 pointer-events-none absolute bottom-[41%] right-[9%] z-[15]"
        aria-hidden="true"
      ></span>

      <!-- ========================================================= -->
      <!-- MICRO PARTICLE -->
      <!-- ========================================================= -->

      <span
        class="hero-micro-particle pointer-events-none absolute left-[43%] top-[8%] z-[15]"
        aria-hidden="true"
      ></span>

      <!-- ========================================================= -->
      <!-- GIF -->
      <!-- ========================================================= -->

      <div class="hero-image-wrapper relative z-[30] flex items-center justify-center">
        <img
          src="/images/hero/giovanna.gif"
          alt="Giovanna"
          class="pointer-events-none relative h-auto w-full rounded-b-[160px] object-contain opacity-95 drop-shadow-[0_25px_55px_rgba(124,58,237,0.14)]"
        />
      </div>
    </div>
  </div>
</section>

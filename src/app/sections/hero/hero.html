<section id="home" class="relative flex min-h-[calc(100vh-4rem)] items-center overflow-hidden">
  <div
    class="mx-auto grid w-full max-w-7xl grid-cols-1 items-center gap-12 px-6 py-20 lg:grid-cols-2 lg:px-8"
  >
    <!-- CONTENT -->
    <div class="relative z-20 max-w-2xl">
      <p class="mb-5 font-mono text-sm font-medium uppercase tracking-[0.18em] text-[#7C3AED]">
        Full Stack Developer
      </p>

      <h1
        class="text-5xl font-semibold leading-[1.05] tracking-[-0.045em] text-[#17131C] sm:text-6xl lg:text-7xl"
      >
        I build digital
        <span class="text-[#7C3AED]"> experiences</span>
        with code & design.
      </h1>

      <p class="mt-7 max-w-xl text-base leading-7 text-[#706A78] sm:text-lg">
        I'm Giovanna, a Full Stack Developer focused on front-end development, UI/UX and creating
        thoughtful digital experiences.
      </p>

      <!-- ACTIONS -->
      <div class="mt-9 flex flex-wrap items-center gap-5">
        <!-- View my work -->
        <div class="relative w-fit">
          <!-- Decorative border -->
          <div
            class="pointer-events-none absolute -left-1.5 -top-1.5 h-[calc(50%+6px)] w-[calc(100%+12px)] border border-[#17131C]/30 border-b-0 transition-all duration-300 group-hover:border-[#7C3AED]/70"
          ></div>

          <div
            class="pointer-events-none absolute -bottom-1.5 -left-1.5 h-[calc(50%+6px)] w-[calc(100%+12px)] border border-[#17131C]/30 border-t-0 transition-all duration-300 group-hover:border-[#7C3AED]/70"
          ></div>

          <a
            href="#work"
            class="group relative z-10 flex items-center gap-4 border border-[#17131C] bg-[#17131C] px-7 py-3.5 text-sm font-medium tracking-wide text-white transition-all duration-300 hover:border-[#7C3AED] hover:bg-[#7C3AED]"
          >
            <span>View my work</span>

            <i
              class="pi pi-arrow-up-right text-base transition-transform duration-300 group-hover:translate-x-1"
              aria-hidden="true"
            ></i>
          </a>
        </div>

        <!-- Contact -->
        <a
          href="#contact"
          class="flex items-center gap-3 border border-[#E7E2EC] bg-white px-7 py-3.5 text-sm font-medium tracking-wide text-[#17131C] transition-all duration-300 hover:-translate-y-0.5 hover:border-[#7C3AED] hover:text-[#7C3AED]"
        >
          Contact me
        </a>
      </div>
    </div>

    <!-- VISUAL -->
    <div class="relative flex h-[500px] w-full items-center justify-center">
      <!-- ========================================= -->
      <!-- THREADS / BACKGROUND -->
      <!-- ========================================= -->

      <div class="pointer-events-none absolute inset-[-15%] z-0 opacity-[0.28]" aria-hidden="true">
        <div #threadsCanvas class="h-full w-full"></div>
      </div>

      <!-- ========================================= -->
      <!-- MAIN GLOW -->
      <!-- ========================================= -->

      <div
        class="pointer-events-none absolute left-1/2 top-1/2 z-0 h-[420px] w-[420px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-gradient-to-br from-[#C4B5FD]/30 via-[#E9D5FF]/20 to-[#BFDBFE]/25 blur-[100px]"
      ></div>

      <!-- ========================================= -->
      <!-- SECONDARY GLOW -->
      <!-- ========================================= -->

      <div
        class="pointer-events-none absolute left-1/2 top-1/2 z-0 h-72 w-72 -translate-x-1/2 -translate-y-1/2 rounded-full bg-[#EDE9FE]/50 blur-3xl"
      ></div>

      <!-- ========================================= -->
      <!-- DECORATIVE CIRCLES -->
      <!-- ========================================= -->

      <div
        class="pointer-events-none absolute left-1/2 top-1/2 z-10 h-80 w-80 -translate-x-1/2 -translate-y-1/2 rounded-full border border-[#7C3AED]/10"
      ></div>

      <div
        class="pointer-events-none absolute left-1/2 top-1/2 z-10 h-96 w-96 -translate-x-1/2 -translate-y-1/2 rounded-full border border-[#7C3AED]/5"
      ></div>

      <!-- ========================================= -->
      <!-- SMALL DECORATIVE DOTS -->
      <!-- ========================================= -->

      <div
        class="pointer-events-none absolute left-[18%] top-[25%] z-10 h-2 w-2 rounded-full bg-[#A78BFA]/40 blur-[1px]"
      ></div>

      <div
        class="pointer-events-none absolute right-[18%] top-[35%] z-10 h-1.5 w-1.5 rounded-full bg-[#60A5FA]/40"
      ></div>

      <div
        class="pointer-events-none absolute bottom-[25%] left-[25%] z-10 h-1 w-1 rounded-full bg-[#7C3AED]/30"
      ></div>

      <!-- ========================================= -->
      <!-- GIF -->
      <!-- ========================================= -->

      <div class="relative z-20 flex items-center justify-center">
        <img
          src="/images/hero/giovanna.gif"
          alt="Giovanna"
          class="pointer-events-none relative z-10 h-auto w-full max-w-lg rounded-b-full object-contain opacity-95 drop-shadow-[0_20px_45px_rgba(124,58,237,0.08)]"
        />
      </div>
    </div>
  </div>
</section>

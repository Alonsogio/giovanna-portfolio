<section
  #heroSection
  id="home"
  class="hero-section relative flex min-h-[calc(100vh-4rem)] items-center overflow-hidden bg-[#F9F8FC]"
>
  <!-- =====================================================
       BACKGROUND ATMOSPHERE
       ===================================================== -->

  <div
    class="hero-section-atmosphere pointer-events-none absolute inset-x-0 bottom-0 z-0 h-[42%]"
    aria-hidden="true"
  ></div>

  <div
    class="hero-section-purple-light pointer-events-none absolute -bottom-10 left-[12%] z-0 h-[230px] w-[230px]"
    aria-hidden="true"
  ></div>

  <div
    class="hero-section-blue-light pointer-events-none absolute -bottom-12 right-[12%] z-0 h-[240px] w-[240px]"
    aria-hidden="true"
  ></div>

  <!-- =====================================================
       HERO CONTENT
       ===================================================== -->

  <div
    class="mx-auto grid w-full max-w-7xl grid-cols-1 items-center gap-12 px-6 py-20 lg:grid-cols-2 lg:px-8"
  >
    <!-- ===================================================
         TEXT
         =================================================== -->

    <div #heroContent class="relative z-30 max-w-2xl">
      <p
        class="hero-eyebrow mb-5 font-mono text-sm font-medium uppercase tracking-[0.18em] text-[#7C3AED]"
      >
        Full Stack Developer
      </p>

      <h1
        #heroTitle
        class="hero-title text-5xl font-semibold leading-[1.05] tracking-[-0.045em] text-[#17131C] sm:text-6xl lg:text-7xl"
      >
        <span class="hero-title-line"> I build digital </span>

        <span class="hero-title-line">
          <span class="text-[#7C3AED]"> experiences </span>
        </span>

        <span class="hero-title-line"> with code &amp; design. </span>
      </h1>

      <p
        #heroDescription
        class="hero-description mt-7 max-w-xl text-base leading-7 text-[#706A78] sm:text-lg"
      >
        I'm Giovanna, a Full Stack Developer focused on
        <br class="hidden sm:block" />
        front-end development, UI/UX and creating thoughtful
        <br class="hidden sm:block" />
        digital experiences.
      </p>

      <!-- =================================================
           ACTIONS
           ================================================= -->

      <div #heroActions class="mt-9 flex flex-wrap items-center gap-5">
        <div class="group relative w-fit">
          <div
            class="pointer-events-none absolute -left-1.5 -top-1.5 h-3 w-3 border-l border-t border-[#17131C]/30 transition-transform duration-500 ease-out group-hover:-translate-x-0.5 group-hover:-translate-y-0.5"
          ></div>

          <div
            class="pointer-events-none absolute -bottom-1.5 -right-1.5 h-3 w-3 border-b border-r border-[#17131C]/30 transition-transform duration-500 ease-out group-hover:translate-x-0.5 group-hover:translate-y-0.5"
          ></div>

          <a
            href="#work"
            class="group relative z-10 flex items-center gap-4 border border-[#17131C] bg-[#17131C] px-7 py-3.5 text-sm font-medium tracking-wide text-white transition-all duration-300 hover:border-[#7C3AED] hover:bg-[#7C3AED]"
          >
            <span> View my work </span>

            <i
              class="pi pi-arrow-up-right text-base transition-transform duration-300 group-hover:translate-x-1"
              aria-hidden="true"
            ></i>
          </a>
        </div>

        <a
          href="#contact"
          class="hero-contact-button flex items-center gap-3 border border-[#E7E2EC] bg-white px-7 py-3.5 text-sm font-medium tracking-wide text-[#17131C] transition-all duration-300 hover:-translate-y-0.5 hover:border-[#7C3AED] hover:text-[#7C3AED]"
        >
          Contact me
        </a>
      </div>
    </div>

    <!-- ===================================================
         HERO VISUAL
         =================================================== -->

    <div
      #heroVisual
      class="hero-visual relative z-10 flex h-[470px] w-full items-center justify-center"
    >
      <!-- =================================================
           FLOATING GROUND SHADOW
           ================================================= -->

      <div
        class="hero-floating-ground pointer-events-none absolute left-1/2 top-[113%] z-[2]"
        aria-hidden="true"
      ></div>

      <!-- =================================================
           MAIN ATMOSPHERIC GLOW
           ================================================= -->

      <div
        class="hero-main-glow hero-parallax-deep pointer-events-none absolute left-1/2 top-1/2 z-0 h-[480px] w-[480px]"
        aria-hidden="true"
      ></div>

      <!-- =================================================
           SPHERE AMBIENT
           ================================================= -->

      <div
        class="hero-sphere-ambient pointer-events-none absolute left-1/2 top-1/2 z-[1] h-[450px] w-[450px]"
        aria-hidden="true"
      ></div>

      <!-- =================================================
           MAIN SPHERE
           ================================================= -->

      <div
        class="hero-sphere hero-parallax-main pointer-events-none absolute left-1/2 top-1/2 z-[5] h-[430px] w-[430px]"
        aria-hidden="true"
      >
        <div class="hero-sphere-core absolute inset-0"></div>

        <div class="hero-purple-glow absolute -inset-20"></div>

        <div class="hero-blue-glow absolute -inset-24"></div>

        <div class="hero-inner-glow absolute inset-[55px]"></div>

        <!-- =================================================
             SMALL LIGHTS INSIDE / AROUND SPHERE
             ================================================= -->

        <span class="hero-orbit-dot hero-orbit-dot-1 absolute left-[7%] top-[25%]"></span>

        <span class="hero-orbit-dot hero-orbit-dot-2 absolute right-[5%] top-[29%]"></span>

        <span class="hero-orbit-dot hero-orbit-dot-3 absolute bottom-[14%] left-[12%]"></span>

        <span class="hero-orbit-dot hero-orbit-dot-4 absolute bottom-[18%] right-[10%]"></span>
      </div>

      <!-- =================================================
           ORBIT RINGS
           ================================================= -->

      <div
        class="hero-sketch-orbit hero-sketch-orbit-1 hero-parallax-orbit pointer-events-none absolute left-1/2 top-1/2 z-[8] h-[440px] w-[440px]"
        aria-hidden="true"
      ></div>

      <div
        class="hero-sketch-orbit hero-sketch-orbit-2 hero-parallax-orbit pointer-events-none absolute left-1/2 top-1/2 z-[8] h-[500px] w-[500px]"
        aria-hidden="true"
      ></div>

      <div
        class="hero-sketch-orbit hero-sketch-orbit-3 hero-parallax-orbit pointer-events-none absolute left-1/2 top-1/2 z-[8] h-[475px] w-[475px]"
        aria-hidden="true"
      ></div>

      <!-- =================================================
           WHITE LIGHT ORBS
           ================================================= -->

      <span
        class="hero-light-orb hero-light-orb-1 hero-parallax-orb pointer-events-none absolute left-[16%] top-[46%] z-[20]"
        aria-hidden="true"
      ></span>

      <span
        class="hero-light-orb hero-light-orb-2 hero-parallax-orb pointer-events-none absolute right-[11%] top-[50%] z-[20]"
        aria-hidden="true"
      ></span>

      <span
        class="hero-light-orb hero-light-orb-3 hero-parallax-orb pointer-events-none absolute bottom-[56%] left-[8%] z-[20]"
        aria-hidden="true"
      ></span>

      <!-- =================================================
           PURPLE PARTICLES
           ================================================= -->

      <span
        class="hero-particle hero-particle-purple hero-particle-1 hero-parallax-particle pointer-events-none absolute left-[12%] top-[8%] z-[25]"
        aria-hidden="true"
      ></span>

      <span
        class="hero-particle hero-particle-purple hero-particle-3 hero-parallax-particle pointer-events-none absolute bottom-[13%] left-[3%] z-[25]"
        aria-hidden="true"
      ></span>

      <!-- =================================================
           BLUE PARTICLES
           ================================================= -->

      <span
        class="hero-particle hero-particle-blue hero-particle-2 hero-parallax-particle pointer-events-none absolute right-[11%] top-[17%] z-[25]"
        aria-hidden="true"
      ></span>

      <span
        class="hero-particle hero-particle-blue hero-particle-4 hero-parallax-particle pointer-events-none absolute bottom-[39%] right-[6%] z-[25]"
        aria-hidden="true"
      ></span>

      <!-- =================================================
           MICRO PARTICLE
           ================================================= -->

      <span
        class="hero-micro-particle hero-parallax-particle pointer-events-none absolute left-[43%] top-[5%] z-[25]"
        aria-hidden="true"
      ></span>

      <!-- =================================================
           PERSON / GIF
           ================================================= -->

      <div class="hero-image-stage hero-parallax-image absolute left-1/2 top-1/2 z-[30]">
        <!-- =================================================
             PERSON CONTACT SHADOW
             ================================================= -->

        <div class="hero-person-shadow absolute left-1/2 top-[108%] z-0" aria-hidden="true"></div>

        <!-- ===============================================
             BODY INSIDE SPHERE
             =============================================== -->

        <div class="hero-image-inside absolute inset-0 z-[10]">
          <img src="/images/hero/giovanna.gif" alt="" class="hero-image-gif" />
        </div>

        <!-- ===============================================
             HEAD OUTSIDE SPHERE
             =============================================== -->

        <div class="hero-image-head absolute inset-0 z-[20]">
          <img src="/images/hero/giovanna.gif" alt="Giovanna" class="hero-image-gif" />
        </div>
      </div>
    </div>
  </div>
</section>
